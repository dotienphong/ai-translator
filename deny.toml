# Kiểm tra phụ thuộc Rust theo spec §6.12. Chạy `cargo deny check` sau mỗi lần cài hoặc nâng cấp thư viện.

[graph]
# Chỉ xét hai nền tảng phát hành. Phụ thuộc chỉ có trên Linux (gtk của Tauri) không vào bản build.
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = true

[advisories]
yanked = "deny"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste chỉ là macro lúc biên dịch, do candle (gemm) kéo vào; candle 0.11 chưa bỏ" },
    # zip 8.6.0 (RUSTSEC-2026-0367, -0368, -0369: giải nén bằng `extract()` giữ bit SUID/SGID, theo liên kết symlink ra ngoài thư mục đích).
    # zip chỉ vào qua candle-core, bản mới nhất 0.11.0 (2026-06-26) đòi `zip = "^8.6.0"`, nên chưa nâng lên zip 9.0 (bản sửa) được. candle-core
    # chỉ ĐỌC zip vào bộ nhớ (`ZipArchive::new`, cho file `.npz` và pickle), không gọi `extract()` ở đâu; app dùng candle chỉ cho Tensor/Device của
    # VAD (crates/pipeline/src/vad.rs), không mở file zip hay `.npz` nào. Cả ba lỗi nằm ở `extract()`, nên không chạm tới đường chạy của app.
    # Bỏ ba dòng này (và `.cargo/audit.toml`) khi candle nâng lên zip 9 hay bỏ phụ thuộc zip, rồi chạy lại `cargo deny check` và `cargo audit`.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 qua candle-core 0.11.0; chỉ lỗi ở extract(), candle và app không gọi" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 qua candle-core 0.11.0; chỉ lỗi ở extract(), candle và app không gọi" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 qua candle-core 0.11.0; chỉ lỗi ở extract(), candle và app không gọi" },
]

[licenses]
# App đóng nguồn: chỉ nhận giấy phép dễ dãi, và MPL-2.0 (copyleft theo từng file, dùng nguyên bản không sửa).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# Danh sách trên dùng cho cả workspace sau này, nên giấy phép chưa gặp không phải lỗi.
unused-allowed-license = "allow"

[licenses.private]
# Crate trong workspace không publish nên không khai giấy phép.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Bất biến kiến trúc (spec §5, §6.12): chỉ asr-worker được link whisper.cpp (ggml); tiến trình chính thì không.
deny = [
    { crate = "whisper-rs-sys", wrappers = ["whisper-rs", "asr-worker"], reason = "ggml chỉ được vào qua whisper-rs, hoặc asr-worker đọc bảng thiết bị ggml" },
    { crate = "whisper-rs", wrappers = ["asr-worker"], reason = "chỉ asr-worker được link whisper.cpp" },
    # Một thư viện mật mã C duy nhất trong tiến trình chính (§6.12, mục 6.4 của kế hoạch 00): OpenSSL chỉ vào qua
    # SQLCipher trên Windows (kế hoạch 03), build tĩnh từ mã nguồn.
    { crate = "openssl-sys", wrappers = ["libsqlite3-sys"], reason = "OpenSSL chỉ dành cho SQLCipher trên Windows" },
    { crate = "openssl-src", wrappers = ["openssl-sys"], reason = "OpenSSL chỉ build kèm cho SQLCipher" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
