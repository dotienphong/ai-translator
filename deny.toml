# Kiểm tra phụ thuộc Rust theo spec §6.12. Chạy `cargo deny check` sau mỗi lần cài hoặc nâng cấp thư viện.

[graph]
# Chỉ xét hai nền tảng phát hành. Phụ thuộc chỉ có trên Linux (gtk của Tauri) không vào bản build.
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = true

[advisories]
yanked = "deny"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste chỉ là macro lúc biên dịch, do candle (gemm) kéo vào; candle 0.11 chưa bỏ" },
    # Bản bị rút khỏi crates.io (yanked) từ khi zip 9.0 ra (2026-10), không có bản 8.x nào khác thay: candle-core 0.11.0 (bản mới
    # nhất) đòi `zip = "^8.6.0"` nên `cargo update -p zip` không chọn được bản nào. zip chỉ vào qua candle-core cho đọc file `.npz`
    # (numpy); app dùng candle chỉ cho Tensor/Device của VAD (crates/pipeline/src/vad.rs), không mở file zip nào, nên các sửa lỗi của
    # zip 9.0.x (theo liên kết symlink ở set_permissions, tràn số ở bộ giải nén implode) không chạm tới đường chạy của app. Bỏ dòng này
    # khi candle nâng lên zip 9 (hay bỏ phụ thuộc zip), rồi chạy lại `cargo deny check`.
    { crate = "zip@8.6.0", reason = "yanked; candle-core 0.11.0 đòi zip ^8.6.0; app không đọc file zip nào" },
]

[licenses]
# App đóng nguồn: chỉ nhận giấy phép dễ dãi, và MPL-2.0 (copyleft theo từng file, dùng nguyên bản không sửa).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# Danh sách trên dùng cho cả workspace sau này, nên giấy phép chưa gặp không phải lỗi.
unused-allowed-license = "allow"

[licenses.private]
# Crate trong workspace không publish nên không khai giấy phép.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Bất biến kiến trúc (spec §5, §6.12): chỉ asr-worker được link whisper.cpp (ggml); tiến trình chính thì không.
deny = [
    { crate = "whisper-rs-sys", wrappers = ["whisper-rs", "asr-worker"], reason = "ggml chỉ được vào qua whisper-rs, hoặc asr-worker đọc bảng thiết bị ggml" },
    { crate = "whisper-rs", wrappers = ["asr-worker"], reason = "chỉ asr-worker được link whisper.cpp" },
    # Một thư viện mật mã C duy nhất trong tiến trình chính (§6.12, mục 6.4 của kế hoạch 00): OpenSSL chỉ vào qua
    # SQLCipher trên Windows (kế hoạch 03), build tĩnh từ mã nguồn.
    { crate = "openssl-sys", wrappers = ["libsqlite3-sys"], reason = "OpenSSL chỉ dành cho SQLCipher trên Windows" },
    { crate = "openssl-src", wrappers = ["openssl-sys"], reason = "OpenSSL chỉ build kèm cho SQLCipher" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
