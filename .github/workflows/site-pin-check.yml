# Kiểm script cài của website (`irm https://aitranslator.vn/install.ps1 | iex`, `curl … | bash`) có bắt kịp bản stable không.
# `pnpm deploy` của website ghim số phiên bản stable và SHA-256 vào hai script (chủ ý, kiểm toán bảo mật 2026-10-25: website là
# nơi tin cậy riêng, deploy bằng tay từ máy người vận hành), nên CI không deploy thay được; workflow này chỉ NHẮC: run đỏ thì GitHub
# gửi email cho chủ repo. Không có secret, chỉ đọc trang công khai. Xem scripts/release/check-site-pin.mjs.
name: Site pin check

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-pin-check
  cancel-in-progress: true

jobs:
  check:
    name: Script cài khớp bản stable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: So bản ghim của script cài với stable/latest.json
        run: node scripts/release/check-site-pin.mjs --grace-minutes 120
