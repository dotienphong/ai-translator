# TẠM THỜI (2026-10-05): chẩn đoán vì job `sign` của sign-manifest.yml báo "repeatedly failed to be acquired" trên cả macOS
# lẫn Linux. Xóa file này sau khi tìm ra nguyên nhân. Không in giá trị secret nào, chỉ độ dài.
name: Diag environment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plain:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "job không có environment chạy được"
  env_only:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - run: echo "job có environment release (không dùng secret) chạy được"
  env_secret:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - env:
          K: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          if [ -n "$K" ]; then echo "MANIFEST_SIGNING_KEY có, ${#K} ký tự"; else echo "MANIFEST_SIGNING_KEY TRỐNG"; exit 1; fi
