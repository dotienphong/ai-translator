# TẠM THỜI (2026-10-05): chẩn đoán vì job có `environment: release` báo "repeatedly failed to be acquired" (cả khi không dùng
# secret). Đã loại trừ: runner (Linux cũng lỗi), mọi environment (`diag-open` xanh), luật người duyệt (`diag-review` xanh).
# Nghi phạm còn lại: một secret hỏng trong `release`. Xóa file này sau khi xong.
name: Diag environment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  env_release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - run: echo "job có environment release (không dùng secret) chạy được"
