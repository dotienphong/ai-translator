# Build bản phát hành từ tag đã commit (spec §10.2): `.dmg` cho macOS arm64 và bộ cài NSIS `.exe` cho Windows x64, cùng
# SHA-256 của bộ cài, bảng SHA-256 của tiến trình phụ (Đ15) và chữ ký bản cập nhật. Kế hoạch 07a; 07b thêm phần đăng bản:
# từ tag `v*`, job `publish` đăng bản lên R2 và cập nhật `latest.json` của kênh (stable, hay beta với tag `vX.Y.Z-beta.N`),
# rồi job `github-release` tạo bản nháp GitHub Release. Chạy tay (workflow_dispatch) mặc định không đăng gì; tick ô `publish`
# (chỉ trên nhánh `main`) thì đăng như khi đẩy tag, với tag `v<version trong tauri.conf.json>` (Stable khi version là X.Y.Z).
#
# Tách job theo secret (Q1 của review 07a lần 1): job biên dịch code (của repo và của bên thứ ba: crate, CMake, npm) không
# có secret nào; job có secret (environment `release`) chạy trên runner mới, checkout lại đúng commit, không biên dịch gì,
# chỉ chạy script của repo và công cụ của hệ thống. Hai loại job chỉ nối với nhau qua artifact. Vì `build.rs` băm tiến
# trình phụ đã ký, mỗi nền tảng có bốn job: build tiến trình phụ → ký chúng → build app → ký và đóng gói. Chữ ký bản cập
# nhật ký ở một job riêng cuối cùng, để khóa ký bản cập nhật không nằm chung job với chứng thư hay dịch vụ ký.
#
# Environment `release` chỉ cho tag `v*` (cùng nhánh `main` cho lần chạy tay) TRƯỚC khi nhập secret đầu tiên (kế hoạch 07a,
# Task 14). Từ 2026-10-09 không còn Required reviewers (chủ dự án chọn, vì chỉ một người và mỗi lần chạy phải bấm duyệt
# sáu lần): luật giới hạn nhánh/tag là lớp chặn chính, đừng bỏ nó. Tag `v*` đẩy lên là tự đăng bản lên R2. Job `gate` chặn
# thêm: commit của tag phải nằm trên `main` (đẩy `main` trước rồi mới đẩy tag), và nếu đặt Required reviewers cho
# environment `release-gate` thì mỗi lần phát hành chỉ phải duyệt một lần.
#
# Secret của environment `release`:
#   APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD   chứng thư Developer ID Application (.p12, base64) và mật khẩu
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER  khóa App Store Connect API để notarize
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  khóa ký bản cập nhật (Q17)
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   token R2 chỉ ghi được bucket bản phát hành (kế hoạch 07b, Task 12)
# Biến cấu hình (Variables, không bí mật):
#   APPLE_TEAM_ID         Team ID mà app tự kiểm trong chữ ký của mình (kế hoạch 06, AI_TRANSLATOR_TEAM_ID). Để trống thì
#                         bản macOS ký ad-hoc và app chỉ kiểm chữ ký còn nguyên vẹn (spec 2026-10-05)
#   WINDOWS_SIGNER        tên chủ chứng thư ký mã Windows (kế hoạch 06, AI_TRANSLATOR_SIGNER). Để trống thì bản Windows
#                         không ký và app không kiểm chữ ký Authenticode (spec 2026-10-08); đặt thì phải đặt cả
#                         MT_WINDOWS_SIGN_CMD, không thì job bộ cài dừng
#   MT_WINDOWS_SIGN_CMD   lệnh ký của dịch vụ ký cloud (sign-windows.mjs; chọn ở T2)
#   RELEASES_BUCKET       tên bucket R2 của bản phát hành; RELEASES_BASE_URL  URL công khai của nó, đúng URL gốc build sẵn
#                         trong app (`updater/source.rs`, PRODUCTION_URL)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Đăng bản lên R2 và tạo bản nháp GitHub Release (tag v<version trong tauri.conf.json>; chỉ nhánh main)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Cổng của mọi job khác (kiểm toán bảo mật 2026-10-09): tag `v*` không bắt buộc trỏ vào commit của `main`, nên một
  # credential ghi được repo có thể gắn tag vào commit ở nhánh khác (sửa script ký hay đăng bản) mà vẫn chạy được các job có
  # secret. Job này dừng cả pipeline khi commit không nằm trên `main`. Environment `release-gate` không có secret; thêm
  # Required reviewers cho nó ở Settings › Environments thì mỗi lần phát hành chỉ phải duyệt một lần (thay cho sáu lần khi
  # đặt reviewers ở `release`). Mọi job có secret đều đứng sau job này qua chuỗi `needs`.
  gate:
    name: "0: cổng phát hành (commit thuộc main)"
    runs-on: macos-26
    timeout-minutes: 10
    environment: release-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commit phải nằm trên nhánh main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Commit $GITHUB_SHA không nằm trên main: đẩy main trước rồi mới đẩy tag."
            exit 1
          fi

  macos-sidecars:
    name: "macOS 1/4: tiến trình phụ (không secret)"
    needs: gate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Tag khớp version trong tauri.conf.json (bản beta là X.Y.Z-beta.N)
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release/release-ready.mjs --tag "$GITHUB_REF_NAME"
      - name: Rust theo rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about@0.9.2
      - name: asr-worker và llama-server tĩnh, ký ad-hoc
        run: scripts/release/build-sidecars-macos.sh
      - name: THIRD_PARTY_NOTICES (tải mã nguồn crate của mọi target trước, vì cargo-about chạy --frozen)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          cargo fetch --locked
          node scripts/release/notices.mjs --out THIRD_PARTY_NOTICES.txt --llama-src target/release-work/llama.cpp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-sidecars
          path: |
            src-tauri/binaries/
            THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  macos-sidecars-signed:
    name: "macOS 2/4: ký tiến trình phụ (secret, không biên dịch)"
    needs: macos-sidecars
    runs-on: macos-26
    timeout-minutes: 20
    environment: release
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Artifact của job không secret: tải vào thư mục trống ngoài checkout, chỉ nhận file đúng tên (QA của review 07a lần 2).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-sidecars
          path: ${{ runner.temp }}/in/macos-sidecars
      - name: Nhận tiến trình phụ chưa ký
        run: node scripts/release/take-artifact.mjs macos-sidecars "$RUNNER_TEMP/in/macos-sidecars" .
      - name: Ký bằng Developer ID (không có chứng thư thì ký ad-hoc)
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          chmod +x src-tauri/binaries/*
          trap 'scripts/release/macos-keychain.sh delete' EXIT
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            eval "$(scripts/release/macos-keychain.sh import)"
          fi
          unset P12 P12_PASSWORD
          scripts/release/build-sidecars-macos.sh --sign-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-sidecars-signed
          path: src-tauri/binaries/
          if-no-files-found: error

  macos-app:
    name: "macOS 3/4: build app (không secret)"
    needs: [macos-sidecars, macos-sidecars-signed]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Rust theo rust-toolchain.toml
        run: rustup toolchain install
      - name: protoc
        run: node scripts/release/install-tools.mjs protoc --dest "$RUNNER_TEMP/protoc"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-sidecars-signed
          path: src-tauri/binaries
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-sidecars
          path: target/release-work/unsigned
      - name: Phụ thuộc và build của giao diện
        run: |
          chmod +x src-tauri/binaries/*
          cp target/release-work/unsigned/THIRD_PARTY_NOTICES.txt .
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test bản quyền ở bản release (không có phần chỉ dành cho bản debug)
        run: |
          cargo test --release --locked -p meeting-translator --lib -- pro:: license:: --test-threads=1
      - name: Build app (Tauri không ký)
        env:
          AI_TRANSLATOR_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # Chưa có Team ID (chưa có Developer ID) thì bản ký ad-hoc: app chỉ kiểm chữ ký còn nguyên vẹn (spec 2026-10-05).
          AI_TRANSLATOR_MAC_SIGNING: ${{ vars.APPLE_TEAM_ID == '' && 'adhoc' || '' }}
        run: |
          scripts/release/package-macos.sh build
          tar -C target/release/bundle/macos -cf "$RUNNER_TEMP/app.tar" "AI Translator.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-app
          path: ${{ runner.temp }}/app.tar
          if-no-files-found: error

  macos-sign-app:
    name: "macOS 4/4: ký app, notarize, .dmg (secret, không biên dịch)"
    needs: [macos-sidecars, macos-sidecars-signed, macos-app]
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      MT_RELEASE_OUT: ${{ github.workspace }}/target/release-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Artifact của job không secret: tải vào thư mục trống ngoài checkout, chỉ nhận file đúng tên (QA của review 07a lần 2).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-sidecars-signed
          path: ${{ runner.temp }}/in/macos-sidecars-signed
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-app
          path: ${{ runner.temp }}/in/macos-app
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-sidecars
          path: ${{ runner.temp }}/in/macos-sidecars
      - name: Nhận tiến trình phụ đã ký, app chưa ký, THIRD_PARTY_NOTICES
        run: |
          node scripts/release/take-artifact.mjs macos-sidecars-signed "$RUNNER_TEMP/in/macos-sidecars-signed" src-tauri/binaries
          node scripts/release/take-artifact.mjs macos-app "$RUNNER_TEMP/in/macos-app" "$RUNNER_TEMP/app"
          node scripts/release/take-artifact.mjs macos-sidecars "$RUNNER_TEMP/in/macos-sidecars" target/release-work/unsigned
      - name: Ký app, notarize, .dmg, kiểm dung lượng, SHA-256
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          chmod +x src-tauri/binaries/*
          cp target/release-work/unsigned/THIRD_PARTY_NOTICES.txt .
          mkdir -p target/release/bundle/macos
          tar -C target/release/bundle/macos -xf "$RUNNER_TEMP/app/app.tar"
          trap 'scripts/release/macos-keychain.sh delete; rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            eval "$(scripts/release/macos-keychain.sh import)"
          fi
          if [ "$HAS_NOTARY_KEY" = "true" ]; then
            (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8")
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary.p8"
          fi
          unset P12 P12_PASSWORD APPLE_API_KEY_P8
          scripts/release/package-macos.sh sign
          if [ "$HAS_APPLE_CERT" != "true" ]; then
            echo "Bản macOS ký ad-hoc, chưa notarize (chưa có Developer ID, spec 2026-10-05): khách phải bấm Open Anyway ở lần mở đầu." >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/release/release-check.mjs table src-tauri/binaries --target aarch64-apple-darwin \
            --out "$MT_RELEASE_OUT/sidecar-sha256-macos.json"
          cp THIRD_PARTY_NOTICES.txt "$MT_RELEASE_OUT/THIRD_PARTY_NOTICES-macos.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          path: target/release-out/
          if-no-files-found: error

  windows-sidecars:
    name: "Windows 1/4: tiến trình phụ (không secret)"
    needs: gate
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Tag khớp version trong tauri.conf.json (bản beta là X.Y.Z-beta.N)
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release/release-ready.mjs --tag "$GITHUB_REF_NAME"
      - name: Rust theo rust-toolchain.toml
        run: rustup toolchain install
      - name: Vulkan SDK
        run: node scripts/release/install-tools.mjs vulkan-sdk
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about@0.9.2
      - name: asr-worker-vulkan, asr-worker-cpu, llama-server và DLL (chưa ký)
        # target ngắn: ggml-vulkan cấu hình lồng một dự án CMake (vulkan-shaders-gen), MSBuild FileTracker ghi tlog ở đường
        # dẫn dài 275 ký tự dưới D:\a\ai-translator\ai-translator\target, vượt MAX_PATH 260 nên compiler bị coi là hỏng.
        env:
          CARGO_TARGET_DIR: D:\t
        run: node scripts/release/build-sidecars-windows.mjs
      - name: Kiểm llama-server vừa build nạp được model và trả lời (model thử ~1,2 MB, kiểm SHA-256)
        # Bản 0.1.1 chết ngay khi nạp model (CRT tĩnh giữa các DLL của llama.cpp) mà CI vẫn xanh vì chưa từng nạp model.
        run: node scripts/release/smoke-llama-windows.mjs src-tauri/binaries
      - name: THIRD_PARTY_NOTICES (tải mã nguồn crate của mọi target trước, vì cargo-about chạy --frozen)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          cargo fetch --locked
          node scripts/release/notices.mjs --out THIRD_PARTY_NOTICES.txt --llama-src target/release-work/llama.cpp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-sidecars
          path: |
            src-tauri/binaries/
            THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  windows-sidecars-signed:
    name: "Windows 2/4: ký tiến trình phụ (secret, không biên dịch)"
    needs: windows-sidecars
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Artifact của job không secret: tải vào thư mục trống ngoài checkout, chỉ nhận file đúng tên (QA của review 07a lần 2).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-sidecars
          path: ${{ runner.temp }}/in/windows-sidecars
      - name: Nhận tiến trình phụ và DLL chưa ký
        run: node scripts/release/take-artifact.mjs windows-sidecars "$RUNNER_TEMP/in/windows-sidecars" .
      - name: Ký tiến trình phụ và DLL (không có lệnh ký thì chỉ kiểm dumpbin)
        env:
          MT_WINDOWS_SIGN_CMD: ${{ vars.MT_WINDOWS_SIGN_CMD }}
        run: node scripts/release/build-sidecars-windows.mjs --sign-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-sidecars-signed
          path: src-tauri/binaries/
          if-no-files-found: error

  windows-app:
    name: "Windows 3/4: build app (không secret)"
    needs: [windows-sidecars, windows-sidecars-signed]
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    # SQLCipher build OpenSSL từ mã nguồn bằng perl. `perl` trong PATH của Git Bash là bản MSYS, thiếu module
    # (Locale::Maketext::Simple); openssl-src đọc OPENSSL_SRC_PERL nên trỏ tới Strawberry Perl có sẵn trên runner.
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Rust theo rust-toolchain.toml
        run: rustup toolchain install
      - name: protoc
        run: node scripts/release/install-tools.mjs protoc --dest "$RUNNER_TEMP/protoc"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-sidecars-signed
          path: src-tauri/binaries
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-sidecars
          path: target/release-work/unsigned
      - name: Phụ thuộc và build của giao diện
        run: |
          cp target/release-work/unsigned/THIRD_PARTY_NOTICES.txt .
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test bản quyền ở bản release (không có phần chỉ dành cho bản debug)
        run: |
          cargo test --release --locked -p meeting-translator --lib -- pro:: license:: --test-threads=1
      - name: Build app (chưa đóng gói)
        env:
          AI_TRANSLATOR_SIGNER: ${{ vars.WINDOWS_SIGNER }}
          # Chưa có tên chủ chứng thư (chưa có chứng thư ký mã) thì bản chưa ký: app không kiểm chữ ký (spec 2026-10-08).
          AI_TRANSLATOR_WIN_SIGNING: ${{ vars.WINDOWS_SIGNER == '' && 'unsigned' || '' }}
        run: node scripts/release/package-windows.mjs build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-app
          path: |
            target/release/meeting-translator.exe
            target/release-work/binaries-before-build.json
          if-no-files-found: error

  windows-bundle:
    name: "Windows 4/4: bộ cài NSIS, ký (secret, không biên dịch)"
    needs: [windows-sidecars, windows-sidecars-signed, windows-app]
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release
    defaults:
      run:
        shell: bash
    env:
      MT_RELEASE_OUT: ${{ github.workspace }}/target/release-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Rust theo rust-toolchain.toml (tauri bundle đọc cargo metadata, không biên dịch)
        run: rustup toolchain install
      # Artifact của job không secret: tải vào thư mục trống ngoài checkout, chỉ nhận file đúng tên (QA của review 07a lần 2).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-sidecars-signed
          path: ${{ runner.temp }}/in/windows-sidecars-signed
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-app
          path: ${{ runner.temp }}/in/windows-app
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-sidecars
          path: ${{ runner.temp }}/in/windows-sidecars
      - name: Nhận tiến trình phụ đã ký, file chạy của app, THIRD_PARTY_NOTICES
        run: |
          node scripts/release/take-artifact.mjs windows-sidecars-signed "$RUNNER_TEMP/in/windows-sidecars-signed" src-tauri/binaries
          node scripts/release/take-artifact.mjs windows-app "$RUNNER_TEMP/in/windows-app" target
          node scripts/release/take-artifact.mjs windows-sidecars "$RUNNER_TEMP/in/windows-sidecars" target/release-work/unsigned
      - name: Tauri CLI cho tauri bundle (không secret, không chạy script cài đặt)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Bộ cài NSIS, ký, kiểm, SHA-256
        env:
          MT_WINDOWS_SIGN_CMD: ${{ vars.MT_WINDOWS_SIGN_CMD }}
          WINDOWS_SIGNER: ${{ vars.WINDOWS_SIGNER }}
        run: |
          # App build với tên chủ chứng thư thì chỉ chạy Free nếu file không được ký: dừng thay vì phát hành bản khóa.
          if [ -n "$WINDOWS_SIGNER" ] && [ -z "$MT_WINDOWS_SIGN_CMD" ]; then
            echo "LỖI: đã đặt WINDOWS_SIGNER mà chưa đặt MT_WINDOWS_SIGN_CMD: bản này sẽ bị app coi là không chính hãng" >&2
            exit 1
          fi
          cp target/release-work/unsigned/THIRD_PARTY_NOTICES.txt .
          node scripts/release/package-windows.mjs bundle
          if [ -z "$MT_WINDOWS_SIGN_CMD" ]; then
            echo "Bản Windows chưa ký (chưa có chứng thư ký mã, spec 2026-10-08): SmartScreen có thể cảnh báo, khách bấm More info › Run anyway." >> "$GITHUB_STEP_SUMMARY"
          fi
          cp target/release/bundle/nsis/*-setup.exe "$MT_RELEASE_OUT/"
          node scripts/release/release-check.mjs table src-tauri/binaries --target x86_64-pc-windows-msvc \
            --out "$MT_RELEASE_OUT/sidecar-sha256-windows.json"
          cp THIRD_PARTY_NOTICES.txt "$MT_RELEASE_OUT/THIRD_PARTY_NOTICES-windows.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: target/release-out/
          if-no-files-found: error

  update-signatures:
    name: "Chữ ký bản cập nhật (secret, không biên dịch)"
    needs: [macos-sign-app, windows-bundle]
    runs-on: macos-26
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Artifact của hai job đóng gói, tải theo đúng tên vào thư mục trống ngoài checkout, chỉ nhận file đúng tên (QA của
      # review 07a lần 2). Không tải theo `pattern`: một job bị chiếm có thể đăng thêm artifact khớp mẫu chứa bộ cài giả,
      # và `merge-multiple` để nó ghi đè bộ cài thật trước khi ký (Q-1 của review 07a lần 3).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64
          path: ${{ runner.temp }}/in/macos-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: ${{ runner.temp }}/in/windows-x64
      - name: Nhận bộ cài của hai nền tảng
        run: |
          node scripts/release/take-artifact.mjs macos-arm64 "$RUNNER_TEMP/in/macos-arm64" target/release-out
          node scripts/release/take-artifact.mjs windows-x64 "$RUNNER_TEMP/in/windows-x64" target/release-out
      - name: Tauri CLI cho tauri signer (không secret, không chạy script cài đặt)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Ký .app.tar.gz và bộ cài Windows (tauri signer, gắn phiên bản)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/release/sign-updates.mjs --dir target/release-out
          ls target/release-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: target/release-out/
          if-no-files-found: error

  publish:
    name: "Đăng bản lên R2 (secret, không biên dịch)"
    needs: update-signatures
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 20
    environment: release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # Mọi tag dùng chung một nhóm: hai bản được duyệt gần nhau không đọc cùng latest.json cũ rồi ghi đè nhau (N-4 của review
    # 07b lần 1). Không hủy lần đang chạy.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Đẩy tag thì tag là tên tag; chạy tay có tick `publish` thì tag là v<version>, publish-release.mjs vẫn kiểm nó khớp
      # tauri.conf.json và từ chối version đã đăng.
      - name: Tag của bản
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(node -p 'require("./src-tauri/tauri.conf.json").version')"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Như mọi job có secret: tải vào thư mục trống ngoài checkout, chỉ nhận file đúng tên (07a QĐ29).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: ${{ runner.temp }}/in/release
      - name: Nhận bộ cài và chữ ký của hai nền tảng
        run: node scripts/release/take-artifact.mjs release "$RUNNER_TEMP/in/release" target/release-out
      - name: Đủ cấu hình production (khóa công khai, URL, tên miền website)
        env:
          RELEASES_BASE_URL: ${{ vars.RELEASES_BASE_URL }}
        run: node scripts/release/release-ready.mjs --base-url "$RELEASES_BASE_URL"
      - name: wrangler của server/ (không secret, không chạy script cài đặt)
        run: pnpm -C server install --frozen-lockfile --ignore-scripts
      - name: Tải bộ cài, chữ ký, SHA-256 lên R2; rồi latest.json của kênh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASES_BUCKET: ${{ vars.RELEASES_BUCKET }}
          RELEASES_BASE_URL: ${{ vars.RELEASES_BASE_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node scripts/release/publish-release.mjs --tag "$TAG" --dir target/release-out \
            --bucket "$RELEASES_BUCKET" --base-url "$RELEASES_BASE_URL"

  github-release:
    name: "Bản nháp GitHub Release (không secret)"
    needs: publish
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: ${{ runner.temp }}/in/release
      - name: Nhận bộ cài và chữ ký (chỉ file đúng tên, như job publish)
        run: node scripts/release/take-artifact.mjs release "$RUNNER_TEMP/in/release" target/release-out
      - name: Bản nháp với đủ file của bản (bản beta đánh dấu pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          pre=()
          case "$TAG" in *-beta.*) pre=(--prerelease) ;; esac
          # Đẩy tag thì tag đã có; chạy tay thì chưa, bản nháp trỏ vào commit đã build, tag tạo khi bấm Publish release.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then where=(--verify-tag); else where=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft "${where[@]}" "${pre[@]}" \
            --title "AI Translator ${TAG#v}" --notes "" target/release-out/*
