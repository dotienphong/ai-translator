<h1>Mô phỏng giao diện "Phân biệt người nói"</h1>
<p class="lead">Dựng trên giao diện thật của app (dữ liệu mẫu). Chỉ để xem trước, chưa sửa code app.</p>
<figure><figcaption>1. Thanh phụ đề: tên khi đổi người + vạch màu</figcaption>
<p>Tên lấy từ Teams/Meet/Zoom ("Lan Nguyễn", "Minh Trần"); người chưa đọc được tên hiện "Người 3". Câu tiếp theo của cùng người chỉ có vạch màu.</p>
<div class="dark"><img src="1-thanh-phu-de.png" width="760"></div></figure>
<figure><figcaption>2. Thanh phụ đề khi chưa cấp quyền Trợ năng (macOS)</figcaption>
<p>Vẫn phân biệt Người 1, Người 2; một dòng mời cấp quyền, bấm "Mở Cài đặt" hoặc ✕ để ẩn. Chỉ hiện khi thanh chưa khóa.</p>
<div class="dark"><img src="2-thanh-phu-de-chua-cap-quyen.png" width="760"></div></figure>
<figure><figcaption>3. Bản chép lời: nhãn đầu mỗi lượt nói, bấm để đổi tên / chọn người / gộp</figcaption>
<p>Đổi tên áp dụng cho mọi câu của người đó trong phiên; danh sách "Chọn người trong cuộc họp" lấy từ tên hiện trên cửa sổ họp.</p>
<img src="3-ban-chep-loi-doi-ten.png" width="960"></figure>
<figure><figcaption>4. Cài đặt › Phụ đề: nhóm "Người nói"</figcaption>
<p>Hai công tắc bật sẵn và trạng thái quyền Trợ năng (dùng chung với Gõ dịch). Windows không có dòng quyền Trợ năng.</p>
<img src="4-cai-dat-nguoi-noi.png" width="960"></figure>
