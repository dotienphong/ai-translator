<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<style>
@font-face{font-family:"BVP";font-weight:700;src:url("../../src/assets/fonts/be-vietnam-pro-700-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"BVP";font-weight:700;src:url("../../src/assets/fonts/be-vietnam-pro-700-vietnamese.woff2") format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:"BVP";font-weight:400;src:url("../../src/assets/fonts/be-vietnam-pro-400-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"BVP";font-weight:400;src:url("../../src/assets/fonts/be-vietnam-pro-400-vietnamese.woff2") format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;font-family:"BVP",system-ui,sans-serif;background:linear-gradient(135deg,#0b1f4a 0%,#123b86 45%,#1d63c9 100%);color:#fff;position:relative;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(520px 320px at 88% 8%,rgba(255,255,255,.22),transparent 70%),radial-gradient(520px 320px at 8% 100%,rgba(20,200,190,.28),transparent 70%)}
.brand{position:absolute;left:72px;top:60px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:34px;letter-spacing:-.02em}
.brand img{width:56px;height:56px;border-radius:15px}
.tag{position:absolute;right:72px;top:68px;font-size:22px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
h1{position:absolute;left:72px;top:176px;width:600px;font-size:62px;line-height:1.12;letter-spacing:-.03em;font-weight:700}
p{position:absolute;left:72px;bottom:70px;width:600px;font-size:28px;line-height:1.4;color:#cfe0ff}
.card{position:absolute;right:64px;top:196px;width:400px;border-radius:26px;background:rgba(8,13,26,.82);border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);padding:26px 28px 28px}
.card .lang{display:inline-block;font-size:17px;font-weight:700;letter-spacing:.06em;background:#2f7be8;padding:5px 14px;border-radius:999px;margin-bottom:18px}
.card .src{display:block;font-size:20px;color:#8ea2c7;margin-bottom:10px;line-height:1.35;font-weight:400}
.card .dst{display:block;font-size:30px;font-weight:700;line-height:1.3}
.bars{position:absolute;right:98px;top:104px;display:flex;gap:8px;align-items:center;height:60px}
.bars i{display:block;width:10px;border-radius:5px;background:#fff;opacity:.85}
</style></head>
<body>
<div class="glow"></div>
<div class="brand"><img src="../../src/assets/img/logo.svg" alt="">AI Translator</div>
<div class="tag" id="tag"></div>
<h1 id="title"></h1>
<p id="sub"></p>
<div class="card"><span class="lang" id="langs">EN → VI</span><span class="src" id="src"></span><span class="dst" id="dst"></span></div>
<script>
const q = new URLSearchParams(location.search);
const set = (id, k, d = "") => (document.getElementById(id).textContent = q.get(k) ?? d);
set("title","t"); set("sub","s"); set("tag","tag"); set("src","src","Let's review the timeline in the next meeting."); set("dst","dst","Hãy xem lại tiến độ trong cuộc họp tiếp theo.");
document.documentElement.lang = q.get("lang") ?? "vi";
</script>
</body></html>
