[package]
name = "speaker-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Nhận giọng và đọc tên người nói (spec 2026-10-26-phan-biet-nguoi-noi §4.1). Không chứa ggml, không có mã mạng.
[dependencies]
anyhow.workspace = true
candle-core = "0.11.0"
candle-onnx = "0.11.0"
# Hạ ưu tiên (setpriority), QoS của luồng, stdout riêng cho giao thức (spec §4.1). Cùng bản với asr-worker và pipeline
# (0.2.191 khóa cho cả workspace; bản ổn định mới nhất trên crates.io).
libc = "0.2.191"
# Đọc ModelProto từ byte đã băm (`Embedder::load_checked`). Cùng bản candle-onnx 0.11 dùng; mới nhất trên crates.io.
prost = "0.14.4"
# Pool tính toán toàn cục (QoS utility cho từng luồng). Bản candle-core 0.11 đang dùng; mới nhất trên crates.io.
rayon = "1.12.0"
realfft = "3.5.1"
serde_json.workspace = true
serde.workspace = true
# Công thức đọc tên (kế hoạch 04): định dạng, mẫu chữ, `Attrs`.
speaker-recipe = { path = "../speaker-recipe" }
# SHA-256 của model đúng các byte worker đọc (spec §10). Cùng bản app đang khóa (0.11.0); bản mới nhất 0.11.1: xem mục
# "Điều cần chủ dự án quyết" của docs/superpowers/plans/2026-10-26-phan-biet-nguoi-noi-02-worker-pipeline.md.
sha2 = "0.11.1"
speaker-protocol = { path = "../speaker-protocol" }

[target.'cfg(windows)'.dependencies]
# Thăm dò UI Automation (bin/uia-probe.rs, spike kế hoạch 01).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Đọc cây Accessibility và gói app (bộ đọc tên, kế hoạch 04): CFString, CFArray, CFBundle. Cùng bản `Cargo.lock` và app đang dùng
# (Gõ dịch); bản mới nhất trên crates.io (`cargo search core-foundation`, 2026-10-27). Không có mã mạng.
core-foundation = "0.10.1"
