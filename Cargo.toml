[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
# `cargo build` và `cargo test` không kèm `-p` chỉ chạy các crate trong crates/. App Tauri chạy bằng `pnpm tauri dev`
# (binary từ `cargo build` là bản dev: không nhúng `dist/`, mà mở http://localhost:1420 do Vite phục vụ). Bản nhúng
# frontend thì build bằng `pnpm tauri build`, lệnh này tự chạy `pnpm build` trước.
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rtrb = "0.4.0"
rubato = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# whisper-rs và whisper-rs-sys đã vá để dùng chung một lượt encode (spec §6.4). Xem third_party/README.md.
[patch.crates-io]
whisper-rs = { path = "third_party/whisper-rs" }
whisper-rs-sys = { path = "third_party/whisper-rs-sys" }
