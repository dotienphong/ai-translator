[package]
name = "sea-g2p-rs"
version = "0.10.0"
edition = "2021"
license = "Apache-2.0"
description = "sea-g2p (pnnbao97/sea-g2p) 0.10.0, bản chép nguyên văn phần lõi Rust; bỏ PyO3 và tính năng python (xem UPSTREAM_REV)."
publish = false

[lib]
name = "sea_g2p_rs"
crate-type = ["rlib"]

[features]
# C ABI cho host không phải Rust (src/capi.rs); app không dùng nhưng giữ để mã nguồn y nguyên.
capi = []

[dependencies]
regex = "1.10"
fancy-regex = "0.13"
once_cell = "1.19"
memmap2 = "0.9"
rayon = "1.10"
unicode-normalization = "0.1"

# Mã gốc có nhánh `python` (PyO3) đã bị bỏ khỏi bản chép này; khai báo để không báo cfg lạ.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("python"))'] }

# Mã bên thứ ba chép nguyên văn: không sửa theo clippy của repo này (giữ khớp upstream để dễ nâng bản).
[lints.clippy]
all = { level = "allow", priority = -1 }
