[package]
name = "meeting-translator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Tên lib khác tên binary, để file output không trùng nhau trên Windows (rust-lang/cargo#8519).
name = "meeting_translator_lib"

[build-dependencies]
# SHA-256 của tiến trình phụ trong `binaries/`, build sẵn vào app (spec §10.2, Đ15 của kế hoạch 00).
sha2 = "0.11.0"
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
anyhow.workspace = true
audio-capture = { path = "../crates/audio-capture" }
keyring-core = "1.0.0"
log = "0.4.34"
pipeline = { path = "../crates/pipeline" }
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
sys-locale = "0.3.2"
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-log = "2.10.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-store = "2.5.0"
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
tauri-nspanel = "2.1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
# Kiểu `TranscribeRequest`/`TranscribeResult` cho `asr-worker` giả trong `test_support.rs`.
asr-protocol = { path = "../crates/asr-protocol" }
# `test`: MockRuntime để test ACL của từng cửa sổ mà không mở cửa sổ thật.
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon", "test"] }
